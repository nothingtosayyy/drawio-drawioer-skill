<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380">
  <title>drawioer — AI-powered draw.io diagram generator</title>
  <rect width="1200" height="380" fill="#f8fafc" rx="12"/>
  
  <!-- Decorative diagram nodes -->
  <g opacity="0.12" stroke="#0ea5e9" stroke-width="2" fill="none">
    <rect x="80" y="60" width="180" height="70" rx="6"/>
    <rect x="80" y="170" width="180" height="70" rx="6"/>
    <rect x="80" y="280" width="180" height="70" rx="6"/>
    <rect x="940" y="60" width="180" height="70" rx="6"/>
    <rect x="940" y="170" width="180" height="70" rx="6"/>
    <rect x="940" y="280" width="180" height="70" rx="6"/>
    <path d="M260 95 L310 95" stroke-dasharray="6,4"/>
    <path d="M260 205 L310 205" stroke-dasharray="6,4"/>
    <path d="M260 315 L310 315" stroke-dasharray="6,4"/>
    <path d="M890 95 L940 95" stroke-dasharray="6,4"/>
    <path d="M890 205 L940 205" stroke-dasharray="6,4"/>
    <path d="M890 315 L940 315" stroke-dasharray="6,4"/>
  </g>
  
  <!-- Decorative center connector bar -->
  <g opacity="0.08">
    <rect x="370" y="60" width="460" height="8" rx="4" fill="#0ea5e9"/>
    <rect x="370" y="140" width="460" height="8" rx="4" fill="#0ea5e9"/>
    <rect x="370" y="220" width="140" height="8" rx="4" fill="#f59e0b"/>
    <rect x="550" y="220" width="140" height="8" rx="4" fill="#0ea5e9"/>
    <rect x="730" y="220" width="100" height="8" rx="4" fill="#0ea5e9"/>
  </g>

  <!-- Title -->
  <text x="600" y="155" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="72" font-weight="700" fill="#0f172a" letter-spacing="-2">drawioer</text>
  
  <!-- Tagline -->
  <text x="600" y="205" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="26" fill="#475569" letter-spacing="0">用自然语言描述，AI 生成可编辑的 draw.io 科研图表</text>

  <!-- Feature badges -->
  <g transform="translate(310, 250)">
    <rect x="0" y="0" width="170" height="34" rx="17" fill="#f1f5f9"/>
    <text x="85" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="14" fill="#334155" font-weight="500">生成 .drawio 可编辑文件</text>
  </g>
  <g transform="translate(515, 250)">
    <rect x="0" y="0" width="170" height="34" rx="17" fill="#f1f5f9"/>
    <text x="85" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="14" fill="#334155" font-weight="500">本地预览 + 一键截图导出</text>
  </g>
  <g transform="translate(720, 250)">
    <rect x="0" y="0" width="170" height="34" rx="17" fill="#ecfdf5"/>
    <text x="85" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="14" fill="#059669" font-weight="500">静态校验 · 零误报</text>
  </g>
</svg>